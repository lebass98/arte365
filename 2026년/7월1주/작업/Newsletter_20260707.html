각자가 애쓰고 힘을 다하는 지점들로부터 출발해 문화예술교육이 마주한 현실에 대한 서로 다른 경험과 감각, 고민과 기대를 펼쳐놓습니다. 우리가 놓치고 있었던 질문과 아직 충분히 말해지지 않은 이야기를 발견하고자 합니다.
인터뷰
거창한 성과보다 사람을, 현학적 수사보다 삶을
맞서는 인터뷰① 탈락하고 있는 현장의 말·가성비로 호출되는 예술
박호상 작가·예술교육가·삼천포예술학교 대표

내가 맞서고 있는 건 좋은 의미를 짜내느라 삶보다 미학이 앞서버린 순간들이다. 예술교육 현장에서 참여자의 실제 경험보다 발표 자료나 보고서의 한 문장, 결과공유회의 모양새가 더 중요해질 때가 있다. 그럴 때 예술교육은 삶에 달라붙어 있는 실천이 아니라, 삶을 보기 좋게 포장하는 포장지가 된다. 
인터뷰
예술교육은 작업이 될 수 있을까
맞서는 인터뷰② 성과·참여자 모집·작업
장정아 극작가·문화예술교육가

설문조사에 참여했던 어느 깊은 밤, 이 단어들이 내가 넘어야 할 큰 산처럼 느껴졌다. 너무 막막해서 어디든 얘기하고 싶은 밤이었다. 문화예술교육에 함께 할 참여자의 윤곽을 나름대로 그려보고 섭외 노력을 했다고 생각했는데 내가 놓친 것들이 있었다.
