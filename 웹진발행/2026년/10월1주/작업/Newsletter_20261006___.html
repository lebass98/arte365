이달의 주제
들어오고, 머물고, 떠나는 사람들
제도가 부른 현장 주체들의 유입경로와 계기는 저마다 다릅니다. 제도가 제시한 방향 덕분에 길을 찾은 이부터 예상과는 달라 불편하고 갈등하는 이까지, 제도와 호흡하며 문화예술교육을 실행해온 주체들의 이야기를 살펴봅니다.

인터뷰
‘나다운 교육’을 찾아가는 길
예술교육가의 경로① 공공성과 지속 가능성 사이에서
최지연 더일러스트앤아트 대표·예술교육가

식물이 좋아 가볍게 시작한 분들이 전문적인 표현 기법의 문턱을 넘지 못하고 중도에 그만두는 일이 많았다. ‘내가 무엇을 얼마나 잘 가르치는가’보다 ‘참여자가 어떻게 끝까지 경험할 수 있는가’를 고민하게 된 계기였다.

인터뷰
같은 세계관 속에서, 참여자와 함께-유연하게
예술교육가의 경로② 지원사업을 디딤돌로
장수진 사운드아티스트·예술교육가

예술교육가로 성장하는 것이 예술가로 성장하는 것과 같았다. 나는 불안과 긴장이 높고 세상이 두렵다. 그 속에서 느낀 많은 것을 표현하는 방식으로 음악을 찾았지만 이조차 두려울 때가 많다. 문화예술교육에서는 우리가 함께 현실에 존재하면서 자신을 표현하고 서로를 받아들인다.
