성과를 보여줘야 하다 보니 공연이나 발표 중심으로 수업이 진행하는 시간이 많아지고, 그때마다 과정과 결과 사이에서 고민에 빠지는 것도 사실이다. 그럼에도 문화예술교육이 예술을 단순히 경험하는 데 그쳐서는 안 된다는 생각은 변함이 없다.

인터뷰

이목련 미스터리컴퍼니 대표·예술교육가

발달 단계에 따라 교육이 미치는 영향이 다르고, 나아가 한 사람의 변화를 이끌어낼 수도 있는 중요한 일이라는 것을 깨달으면서 예술교육가로서의 사명감과 함께 책임감도 커졌다. 그때부터 ‘무엇을 가르칠 것인가’만큼 ‘어떻게 가르쳐야 하는가’를 진지하게 고민하기 시작했다.
