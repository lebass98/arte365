이달의 주제
들어오고, 머물고, 떠나는 사람들
제도가 부른 현장 주체들의 유입경로와 계기는 저마다 다릅니다. 제도가 제시한 방향 덕분에 길을 찾은 이부터 예상과는 달라 불편하고 갈등하는 이까지, 제도와 호흡하며 문화예술교육을 실행해온 주체들의 이야기를 살펴봅니다.

예술교육가의 경로⑤ 함께 만들고 함께 걷기
박설 성악가·예술교육가

지금은 정책과 지원사업이 다양해지고 예술교육가의 역할도 전문적인 영역으로 자리 잡았다. 하지만 제도가 발전한 만큼 현장이 더 좋아졌다고만 말하기는 어렵다. 행정과 성과에 대한 부담이 커지면서 참여자와의 만남보다 사업의 틀과 결과(물)를 설명하는데 더 많은 힘을 쏟기도 한다.

인터뷰
시행착오를 딛고, 현명한 벗들과 함께, 계속할 용기
예술교육가의 경로⑥ 지속 가능한 조건 만들기
이효광 디자이너·예술교육가

하나의 프로그램은 다른 참여자를 만나 반복하면서 비로소 완성도가 높아지는데, 지원사업 구조에서는 연속성을 확보하기 어렵다. 때론 이미 검증된 프로그램조차 다른 제목과 형태로 만들기도 한다. 이를 프로그램의 ‘소비 속도가 너무 빠르다’라고 표현하고 싶다.
