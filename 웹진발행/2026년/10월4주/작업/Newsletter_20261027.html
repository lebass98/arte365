이달의 주제
들어오고, 머물고, 떠나는 사람들
제도가 부른 현장 주체들의 유입경로와 계기는 저마다 다릅니다. 제도가 제시한 방향 덕분에 길을 찾은 이부터 예상과는 달라 불편하고 갈등하는 이까지, 제도와 호흡하며 문화예술교육을 실행해온 주체들의 이야기를 살펴봅니다.

이슈
어떤 주체의 출현과 책임에 관하여
제도가 호명한 문화예술교육 주체의 변화
백현주 독립기획자·아르떼365 4기 편집위원장

최근 몇 년 사이 어떤 경향이 분명히 도드라져 보인다. 그동안 익히 보아오던 기획과는 결이 다른, 낯선 어휘, 구조, 전략, 주체의 등장이다. 우선 이들 지원서에선 일목요연하고 막강한 이력이 눈길을 끈다.

인터뷰
어떤 판에서든, 좋아하는 일로 먹고사는 기쁨
예술교육가의 경로⑦ 고유함을 만들고 지키기
김미선 좋은음악 소리랑 대표·예술교육가

지원사업은 재계약이 없는, 불편하지만 안락한 남의 집이다. 평가는 받아도 지원이 넉넉해 좋은 점이 많다. 하지만 선정을 기약할 수는 없으니 한 해 계획을 온전히 내 것으로 세울 수 없다. 작은 집이라도 내 방 한 칸이 있으면 든든하다. 해마다 이사 가지 않을 자유, 고유성을 지킬 자유.
