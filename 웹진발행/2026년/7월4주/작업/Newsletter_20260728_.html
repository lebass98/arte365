각자가 애쓰고 힘을 다하는 지점들로부터 출발해 문화예술교육이 마주한 현실에 대한 서로 다른 경험과 감각, 고민과 기대를 펼쳐놓습니다. 우리가 놓치고 있었던 질문과 아직 충분히 말해지지 않은 이야기를 발견하고자 합니다.
이슈
오늘을 말하는 오롯한 목소리를 듣는다
편집위원 좌담 무엇과 맞서고 있나① 현장이 던진 질문
김주리·김혜일·백현주·이화원·최선영

편집위원 제안을 받았을 때는 왜 지금, 왜 나인가를 먼저 생각했다. 막막하기도 했지만, 지금이야말로 문화예술교육에 조금 더 도발적인 질문을 던져볼 시점이라는 데 공감했다. 반신반의하며 현장에 질문을 던졌는데 800여 명이 응답했다. 전무후무한 일일 거다. 그 순간 ‘지금 이 질문이 유효하구나’라는 생각이 들었다.
이슈

편집위원 좌담 무엇과 맞서고 있나② 다음을 여는 실마리
김주리·김혜일·백현주·이화원·최선영

문화예술교육은 전형적인 교육보다는 예술 행위에 가깝다. 하지만 지금 현장에는 문화예술교육이 교육의 일환이라고 생각하는 사람들이 다수가 된 게 아닐까. 그래서 다시 주체의 문제로 돌아오게 된다. 결국 그들과 어떻게 관계를 맺고 함께 갈 것인가가 앞으로 중요한 과제가 될 것 같다.
