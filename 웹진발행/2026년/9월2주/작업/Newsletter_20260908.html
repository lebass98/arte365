제도가 현장의 주체를 부를 때
제도가 주체를 부를 때, 주체는 어떻게 응답해야 할까요? 지난 20년 문화예술교육의 역사 안에서 제도는 주체를 어떤 의도와 방식으로 호명했는지, 그것의 반작용으로 주체는 또 어떻게 응답하며 지금 같은 모습으로 길을 내었는지 더듬어봅니다.
이슈
지원하는 관계에서 북돋는 관계로
좌담 제도와 현장 주체가 만나는 또 다른 방식
곽지효·유미선·이종은·최선영·황지아

제도는 현장 주체를 어떻게 바라보고 호명하며, 현장 주체는 제도를 어떻게 인식하고 있을까. 문화예술교육가를 위한 연수와 매개자 양성, 주체 발굴사업 등을 기획·운영해 온 실무자들과 함께 제도와 현장이 만나는 과정에서 생기는 기대와 간극을 살펴본다.
아이디어
돌과 물길 따라 도란도란 피어나는 이야기
예술로 365길㉙ 보령공예문화예술연구소
한겨울 도예가·보령공예문화예술연구소 기획자

이제는 폐광되어 사라진 산속의 탄광촌, 계곡물이 흐르는 한 작은 마을에 보령공예문화예술연구소가 자리하고 있다. 산골짜기 사이사이로 슬레이트 지붕과 함석 벽으로 만들어진 허름한 집들이 옹기종기 모여있던 탄광촌은 시간이 흐르며 점차 집다운 집들이 들어서고 30세대 남짓 거주하는 작은 마을이 되었다.
