제도가 현장의 주체를 부를 때
제도가 주체를 부를 때, 주체는 어떻게 응답해야 할까요? 지난 20년 문화예술교육의 역사 안에서 제도는 주체를 어떤 의도와 방식으로 호명했는지, 그것의 반작용으로 주체는 또 어떻게 응답하며 지금 같은 모습으로 길을 내었는지 더듬어봅니다.
리뷰
호기심과 기대를 파고들며, 제도 안팎을 넘나들며
2026 경기 문화예술교육 매개자 연수 &lt;성큼&gt;에서 만난 질문들
이려진 시각작가

“더 솔직하게 말해 볼까요, 저는 오늘 여기 자리한 모두가 문화예술교육을 하는 걸 바라지 않아요.” 이른 아침부터 뜨겁던 여름의 한복판, 예비 문화예술교육가들이 한자리에 모였다. 차분함 속 묘한 긴장감과 열의가 비치던 현장에서 강연자인 최선영 문화예술기획자의 첫마디가 마음을 서늘하게, 아니 시원하게 뚫고 들어왔다.
아이디어
말똥을 치우다가 시작된 이야기
오늘부터 그린㊼ 손끝으로 감각하는 생명의 흔적
박성욱(초록누룽지) 화가

나는 말똥으로 그림을 그린다. 그것으로 말똥탄을 빚고, 아이들과 함께 말똥에 색을 입혀 그림을 그리고 말똥종이를 만든다. 사람들은 자연스럽게 나를 생태적 환경을 생각하는 예술가로, 자원순환을 실천하는 사람으로 바라본다. 나는 환경운동가는 아니다. 지구를 지켜야 한다거나 무엇을 하지 말자는 말을, 좀처럼 입 밖으로 꺼내지 못하는 사람이다.
