제도가 현장의 주체를 부를 때
제도가 주체를 부를 때, 주체는 어떻게 응답해야 할까요? 지난 20년 문화예술교육의 역사 안에서 제도는 주체를 어떤 의도와 방식으로 호명했는지, 그것의 반작용으로 주체는 또 어떻게 응답하며 지금 같은 모습으로 길을 내었는지 더듬어봅니다.
이슈
규격화된 전문성을 넘어 길들지 않은 현장의 에너지로
문화예술교육 핵심역량의 변천 과정
김주리 문화인재양성본부 본부장

사업 참여 인력의 직무분석 연구를 시작으로, 핵심역량을 모델링하고 교육과정을 설계하는 연구가 수차례 있었다. 그러나 특정 조직의 직무와 상황을 전제로 하는 일반적 역량 개념을 적용하기엔 현장의 활동 영역과 방식은 매우 다양하다.
아이디어
연극을 배우는 교실? 연극을 하는 교실!
모두의 예술교육⑫ 연극의 신비로움을 경험하기
김지수 극단 애인 대표·연출가

나는 1998년쯤 처음으로 연극을 보았고, 2004년에 배우로 무대에 올랐다. 나는 연극을 전공하지 않았다. 연극을 보고, 공연을 만드는 경험을 쌓아 왔지만 나는 연극에 대해서 잘 모르는, 연극 하는 사람이다.
